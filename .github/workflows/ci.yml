name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api
      VITE_APP_NAME: StudyFlow CI
      VITE_VERCEL_ENV: development
      VITE_DOCUMENT_MAX_UPLOAD_BYTES: "20971520"
      VITE_AI_ENABLED: "false"
      VITE_AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  prisma:
    name: Prisma validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: database
    env:
      DATABASE_URL: "postgresql://studyflow:ci_placeholder@localhost:5432/studyflow_ci?schema=public"
      DIRECT_URL: "postgresql://studyflow:ci_placeholder@localhost:5432/studyflow_ci?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: database/package-lock.json
      - run: npm ci
      - run: npm run db:validate

  backend:
    name: Backend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: studyflow_ci_password
          POSTGRES_DB: studyflow_ci
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyflow -d studyflow_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    # Ephemeral CI-only values. Never reuse them outside the hosted runner.
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://studyflow:studyflow_ci_password@localhost:55432/studyflow_ci?schema=public"
      DIRECT_URL: "postgresql://studyflow:studyflow_ci_password@localhost:55432/studyflow_ci?schema=public"
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-long-enough
      JWT_REFRESH_SECRET: test-refresh-secret-long-enough
      CLIENT_ORIGIN: http://localhost:3000
      CRON_SECRET: ci-cron-secret-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema ../database/prisma/schema.prisma
      - run: npm run lint
      - run: npm test
      - run: npm run build
