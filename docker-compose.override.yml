services:
  backend:
    build:
      target: deps
    command: sh -c "mkdir -p /app/database/node_modules && npm run prisma:generate && npm run dev"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/api:/app/backend/api
      - ./backend/scripts:/app/backend/scripts
      - ./database/prisma:/app/database/prisma
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyflow}:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/${POSTGRES_DB:-studyflow_dev}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-studyflow}:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/${POSTGRES_DB:-studyflow_dev}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_password}@redis:6379
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
